<div class="data-table-footer" >
    <div class="right paginator">
        <div class="half-wid">
            @if(!common.goodLs()){<span class="v-mid error-message lg-text">{{"Invalid License Key"}} </span>}
            <span #paginatorTracker>Rows 1-25</span> of <span #totalRows class="heavy"></span>&nbsp;&nbsp;&bull;&nbsp;&nbsp;<span #currPage>Page 1/1</span>&nbsp;
        </div><div class="half-wid right">
            <button type="button" #btnPageFirst class="no-btn btn-page-first" (click)="handlePaginatorChange(1)" [disabled]="dataTableService.currPage <= 1 || disableButtons()"><i class="material-icons" aria-hidden="false">first_page</i></button>&nbsp;
            <button type="button" #btnPageBack class="no-btn btn-page-back" (click)="handlePaginatorChange(dataTableService.currPage-1)" [disabled]="dataTableService.currPage <= 1 || disableButtons()"><i class="material-icons" aria-hidden="false">arrow_back_ios</i></button>
            &nbsp;@for(btn of pageBtns; track $index){<button type="button" class="no-btn btn-page" (click)="handlePaginatorChange(btn)" 
            [ngClass]="{'btn-page-selected': btn === dataTableService.currPage, 'last-btn-opt': $index === (pageBtns.length-1) }">{{btn | number}}</button>}&nbsp;
            <button type="button" #btnPageForward class="no-btn btn-page-forward" [disabled]="dataTableService.currPage >= lastPage() || disableButtons()" (click)="handlePaginatorChange(dataTableService.currPage+1)"><i class="material-icons" aria-hidden="false">arrow_forward_ios</i></button>
            &nbsp;<button type="button" #btnPageLast class="no-btn btn-page-last" [disabled]="dataTableService.currPage >= lastPage() || disableButtons()" (click)="handlePaginatorChange(lastPage())"><i class="material-icons" aria-hidden="false">last_page</i></button>
        </div>
    </div>
</div>
